name: Hoppel Hop APK bauen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Projekt holen
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Spiel finden und offline-fähig machen
        run: |
          mkdir -p www
          # Zuletzt hochgeladene HTML-Datei nehmen (klappt auch bei Namen wie "index (1).html")
          SRC=$(git log --diff-filter=AM --name-only --format='' -- '*.html' | grep -v '^www/' | head -n 1 || true)
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            SRC=$(find . -name '*.html' -not -path './www/*' -not -path './node_modules/*' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2- || true)
          fi
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "::error::Keine HTML-Datei gefunden. Bitte lade index.html in dein Projekt hoch."
            exit 1
          fi
          if ! grep -q "Hoppel" "$SRC"; then
            echo "::error::Die Datei '$SRC' ist nicht das Spiel. Bitte lade die richtige index.html hoch."
            exit 1
          fi
          echo "Verwende Spieldatei: $SRC"
          cp "$SRC" www/index.html

          # three.js lokal einbetten (nötig, damit das Spiel offline läuft)
          if curl -fsSL --retry 3 https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o www/three.min.js; then
            sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html
          else
            echo "::warning::three.js konnte nicht eingebettet werden, die App lädt es dann online."
          fi

          # PeerJS (Mehrspieler) lokal einbetten
          if curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/peerjs@1.5/dist/peerjs.min.js -o www/peerjs.min.js; then
            sed -i 's#https://cdn.jsdelivr.net/npm/peerjs@1.5/dist/peerjs.min.js#peerjs.min.js#' www/index.html
          else
            echo "::warning::PeerJS konnte nicht eingebettet werden, die App lädt es dann online."
          fi

          # Schriftart lokal einbetten (falls das klappt, sonst Ersatzschrift)
          curl -fsSL --retry 2 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36" \
            "https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" -o font.css || true
          FONT_URL=$( (grep -o 'https://fonts.gstatic.com[^)]*' font.css 2>/dev/null || true) | tail -n 1)
          if [ -n "$FONT_URL" ] && curl -fsSL "$FONT_URL" -o www/lilita.woff2; then
            sed -i "s#</head>#<style>@font-face{font-family:'Lilita One';src:url(lilita.woff2) format('woff2');font-display:swap}</style></head>#" www/index.html
          fi
          ls -la www

      - name: Capacitor-Projekt anlegen
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Hoppel Hop" de.hoppelhop.app --web-dir www
          npx cap add android
          npx cap sync android

