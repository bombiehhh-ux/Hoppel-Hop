      - name: Gleichen Signaturschlüssel für Updates verwenden
        run: |
          mkdir -p keystore ~/.android
          if [ ! -f keystore/hoppel.keystore ]; then
            keytool -genkeypair -keystore keystore/hoppel.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Hoppel Hop,O=Hoppel,C=DE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/hoppel.keystore
            git commit -m "Signaturschlüssel speichern"
            git push
          fi
          cp keystore/hoppel.keystore ~/.android/debug.keystore

      - name: APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../HoppelHop.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Hoppel Hop 1.${{ github.run_number }}
          files: HoppelHop.apk
